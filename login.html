<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Login | RAMANUJAM ENTRANCE CLASSES</title>

<style>

:root{
    --primary:#3498db;
    --dark:#1a2a6c;
}

body{
    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:'Segoe UI',sans-serif;

    background:
    linear-gradient(
        135deg,
        #1a2a6c,
        #3498db
    );
}

.login-card{

    width:90%;
    max-width:400px;

    background:white;

    padding:40px;

    border-radius:18px;

    box-shadow:
    0 15px 40px rgba(0,0,0,0.2);

    text-align:center;
}

.login-title{

    color:#1a2a6c;

    margin-bottom:10px;
}

.login-sub{

    color:#777;

    margin-bottom:30px;

    font-size:14px;
}

.input-box{

    width:100%;

    padding:14px;

    margin-bottom:18px;

    border-radius:10px;

    border:2px solid #ddd;

    font-size:15px;

    box-sizing:border-box;
}

.input-box:focus{

    border-color:#3498db;

    outline:none;
}

.login-btn{

    width:100%;

    padding:14px;

    border:none;

    border-radius:10px;

    background:
    linear-gradient(
        135deg,
        #1a2a6c,
        #3498db
    );

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;
}

.login-btn:hover{

    transform:translateY(-2px);
}

#error-msg{

    color:red;

    margin-top:15px;

    font-size:14px;
}

.loader{

    display:none;

    margin-top:15px;

    color:#555;
}

</style>
</head>

<body>

<div class="login-card">

    <h2 class="login-title">
        RAMANUJAM ENTRANCE CLASSES
    </h2>

    <div class="login-sub">
        Student Login Portal
    </div>

    <input
        type="text"
        id="userid"
        class="input-box"
        placeholder="User ID">

    <input
        type="password"
        id="password"
        class="input-box"
        placeholder="Password">

    <button
        class="login-btn"
        onclick="login()">

        LOGIN
    </button>

    <div class="loader" id="loader">
        Verifying credentials...
    </div>

    <div id="error-msg"></div>

</div>

    window.location.href = "index.html";

        document.getElementById("userid").value.trim();

    }

</script>

</body>
</html>
